name: macOS QQ runtime

on:
  push:
    paths:
      - .github/tests/macos-qq/**
      - .github/workflows/macos-qq-runtime.yml
  workflow_dispatch:
    inputs:
      napcat_version:
        description: NapCat release to run without login
        type: string
        default: v4.18.36

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    env:
      NAPCAT_VERSION: ${{ inputs.napcat_version || 'v4.18.36' }}
      QQ_SHA256: d270b78f0b210532637076532a883dc8659851b6daa92451983985ab9f3216f0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: qq-cache
        with:
          path: QQ.dmg
          key: macos-qq-d270b78f0b210532
      - name: Download verified QQ and NapCat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f QQ.dmg ]; then
            curl -fLsS --connect-timeout 20 --max-time 300 \
              https://github.com/A-Randomm-User/macOS-save/releases/download/qq/QQ_v7.0.2.53644.dmg -o QQ.dmg
          fi
          echo "$QQ_SHA256  QQ.dmg" | shasum -a 256 -c -
          gh release download "$NAPCAT_VERSION" --repo NapNeko/NapCatQQ --pattern NapCat.Shell.zip
          mkdir NapCat
          unzip -q NapCat.Shell.zip -d NapCat
      - name: Extract original signed QQ
        run: |
          mkdir qq-volume
          hdiutil attach QQ.dmg -readonly -nobrowse -mountpoint "$PWD/qq-volume"
          ditto qq-volume/QQ.app QQ.app
          hdiutil detach "$PWD/qq-volume"
          codesign --verify --deep --strict QQ.app
      - name: Verify real QQ native loading and hooks
        run: python3 .github/tests/macos-qq/runtime.py "$PWD/QQ.app" "$PWD/NapCat"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-qq-runtime-${{ matrix.arch }}
          path: qq-runtime-evidence
