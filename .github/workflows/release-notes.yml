name: Release notes

on:
  push:
    paths:
      - .github/scripts/generate-release-notes.mjs
      - .github/tests/release-notes/**
      - .github/workflows/release-notes.yml
      - .github/workflows/release-publish.yml
  pull_request:
    paths:
      - .github/scripts/generate-release-notes.mjs
      - .github/tests/release-notes/**
      - .github/workflows/release-notes.yml
      - .github/workflows/release-publish.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notes:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20.x
      - run: node --test .github/tests/release-notes/generate.test.mjs
